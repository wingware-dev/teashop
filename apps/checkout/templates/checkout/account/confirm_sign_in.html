{% extends "base.html" %}
{% block title %}Sign in · {{ shop_name }}{% endblock %}
{% block content %}
<div class="checkout narrow-form">
  <h1>Sign in</h1>
  <form method="post">
    {% csrf_token %}
    <p>Press the button to finish signing in.</p>
    <div class="actions"><button type="submit">Sign in</button></div>
  </form>
</div>
{% endblock %}
