<!-- Ornament for the storefront's vine frame (static/js/vines.js): not
     motifs for page designs.  Each is drawn around its own origin (a leaf's
     stalk end, a bird's feet, an insect's middle) and its viewBox is its
     extent in those units, so a <use> with x, y, width and height equal to
     the viewBox draws it at the origin at 1:1.  Colours come from the orn
     custom properties in site.css; a leaf's fill is the leaf property, set
     on each leaf by its lv1, lv2 or lv3 class. -->
<symbol id="orn-leaf-a" viewBox="-1 -9 32 18">
