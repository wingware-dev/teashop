# The whole shop on one server: PostgreSQL, the Django app and Caddy.
# Settings come from .env next to this file (copy .env.example).
#
#   docker compose up -d                    start or update everything
#   deploy/deploy.sh                        build, back up, migrate, start (see docs/ops)
#   docker compose --profile ops run --rm backup              off-site backup
#   docker compose --profile ops run --rm backup restore-test.sh

name: teashop

# Every container's log is rotated: 5 files of 10 MB at most.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: teashop
      POSTGRES_USER: teashop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No ports: the database is reachable only from the other containers.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teashop -d teashop"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  web:
    # deploy/deploy.sh builds teashop-web:<commit> and points :current at it;
    # deploy/rollback.sh points :current back at an earlier build.
    # TEASHOP_TAG is set only by deploy.sh, to check and migrate a new build.
    image: teashop-web:${TEASHOP_TAG:-current}
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # The worker service below uses the same settings.
    environment: &app-environment
      DJANGO_ENV: production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DATABASE_URL: postgres://teashop:${POSTGRES_PASSWORD}@db:5432/teashop
      DJANGO_ALLOWED_HOSTS: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://${SITE_DOMAIN}}
      DJANGO_ADMIN_URL: ${DJANGO_ADMIN_URL:-admin/}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-86400}
      DJANGO_TRUST_X_REAL_IP: "1"
      DJANGO_MEDIA_ROOT: /app/var/media
      STOREFRONT_OPEN: ${STOREFRONT_OPEN:-false}
      SHOP_NAME: ${SHOP_NAME:-Teashop}
      CATALOG_PROTECTED_ORIGINS: ${CATALOG_PROTECTED_ORIGINS:-}
      LABEL_PACKER_ADDRESS: ${LABEL_PACKER_ADDRESS:-}
      INVENTORY_BEST_BY_WARNING_DAYS: ${INVENTORY_BEST_BY_WARNING_DAYS:-60}
      ORGANIC_EXEMPTION_LIMIT: ${ORGANIC_EXEMPTION_LIMIT:-5000}
      ORGANIC_SALES_ALERT: ${ORGANIC_SALES_ALERT:-4000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      # Checkout (docs/checkout.md).  Settings with a default in
      # config/settings.py repeat it here, since an empty value would
      # replace it there.
      SITE_URL: ${SITE_URL:-https://${SITE_DOMAIN}}
      SHOP_CONTACT_EMAIL: ${SHOP_CONTACT_EMAIL:-hello@example.com}
      SHOP_POSTAL_ADDRESS: ${SHOP_POSTAL_ADDRESS:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-${SHOP_NAME:-Teashop} <orders@example.com>}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      OWNER_NOTIFY_EMAIL: ${OWNER_NOTIFY_EMAIL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_ALLOW_LIVE: ${STRIPE_ALLOW_LIVE:-false}
      EASYPOST_API_KEY: ${EASYPOST_API_KEY:-}
      EASYPOST_ALLOW_LIVE: ${EASYPOST_ALLOW_LIVE:-false}
      SHIP_FROM_NAME: ${SHIP_FROM_NAME:-${SHOP_NAME:-Teashop}}
      SHIP_FROM_STREET1: ${SHIP_FROM_STREET1:-}
      SHIP_FROM_STREET2: ${SHIP_FROM_STREET2:-}
      SHIP_FROM_CITY: ${SHIP_FROM_CITY:-}
      SHIP_FROM_STATE: ${SHIP_FROM_STATE:-NY}
      SHIP_FROM_ZIP: ${SHIP_FROM_ZIP:-}
      SHIP_FROM_PHONE: ${SHIP_FROM_PHONE:-}
      TAX_PROVIDER: ${TAX_PROVIDER:-table}
      SALES_TAX_STATES: ${SALES_TAX_STATES:-NY}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      CSP_REPORT_URI: ${CSP_REPORT_URI:-}
      # Fulfillment (docs/fulfillment.md).
      OWNER_NEW_ORDER_EMAILS: ${OWNER_NEW_ORDER_EMAILS:-daily}
      SHIPPING_LABEL_FORMAT: ${SHIPPING_LABEL_FORMAT:-PDF}
      PACKAGE_LABEL_SIZE: ${PACKAGE_LABEL_SIZE:-4x2}
      # Owner dashboard, Wave and estimated tax (docs/reports.md).
      ATTENTION_DEADLINES: ${ATTENTION_DEADLINES:-}
      ATTENTION_DAILY_AT: ${ATTENTION_DAILY_AT:-08:00}
      WAVE_CLIENT: ${WAVE_CLIENT:-fake}
      WAVE_TOKEN: ${WAVE_TOKEN:-}
      WAVE_BUSINESS_ID: ${WAVE_BUSINESS_ID:-}
      WAVE_ACCOUNTS: ${WAVE_ACCOUNTS:-}
      WAVE_START_DATE: ${WAVE_START_DATE:-}
      ESTIMATED_TAX_FEDERAL_RATE: ${ESTIMATED_TAX_FEDERAL_RATE:-0.12}
      ESTIMATED_TAX_STATE_RATE: ${ESTIMATED_TAX_STATE_RATE:-0.055}
      # Email list (docs/emaillist.md).  Empty values fall back to the
      # defaults in config/settings.py.
      EMAIL_LIST_EMAIL_HOST: ${EMAIL_LIST_EMAIL_HOST:-}
      EMAIL_LIST_EMAIL_PORT: ${EMAIL_LIST_EMAIL_PORT:-587}
      EMAIL_LIST_EMAIL_HOST_USER: ${EMAIL_LIST_EMAIL_HOST_USER:-}
      EMAIL_LIST_EMAIL_HOST_PASSWORD: ${EMAIL_LIST_EMAIL_HOST_PASSWORD:-}
      EMAIL_LIST_FROM_EMAIL: ${EMAIL_LIST_FROM_EMAIL:-}
      EMAIL_LIST_ID: ${EMAIL_LIST_ID:-}
      EMAIL_LIST_SEND_AT: ${EMAIL_LIST_SEND_AT:-10:00}
      # AI agents and customer support (docs/agents.md, docs/support.md).
      AGENTS_LIVE: ${AGENTS_LIVE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENTS_MODEL: ${AGENTS_MODEL:-}
      AGENTS_PRICE_PER_MTOK: ${AGENTS_PRICE_PER_MTOK:-}
      AGENTS_MONTHLY_CAP: ${AGENTS_MONTHLY_CAP:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      SUPPORT_INBOX: ${SUPPORT_INBOX:-}
      SUPPORT_IMAP_HOST: ${SUPPORT_IMAP_HOST:-}
      SUPPORT_IMAP_PORT: ${SUPPORT_IMAP_PORT:-993}
      SUPPORT_IMAP_USER: ${SUPPORT_IMAP_USER:-}
      SUPPORT_IMAP_PASSWORD: ${SUPPORT_IMAP_PASSWORD:-}
      SUPPORT_IMAP_FOLDER: ${SUPPORT_IMAP_FOLDER:-}
    volumes:
      - media:/app/var/media
    logging: *logging

  # Background jobs (docs/jobs.md): queued emails, retries and the daily
  # jobs (order summary, renewal reminders).  The web image, run with
  # manage.py run_jobs; the queue is in the database.
  worker:
    image: teashop-web:${TEASHOP_TAG:-current}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "run_jobs"]
    environment: *app-environment
    volumes:
      - media:/app/var/media
    # The worker touches this file every few seconds while it runs.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/teashop-worker.heartbeat') < 300 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # Time to finish the job it is running.
    stop_grace_period: 60s
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${SITE_DOMAIN}}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - media:/srv/media:ro
    logging: *logging

  # Off-site backups with restic; run on demand or from the systemd timer
  # that deploy/server/install-app.sh installs.
  backup:
    profiles: ["ops"]
    build:
      context: deploy/backup
    image: teashop-backup:current
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: teashop
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: teashop
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backups/restic-local}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?set RESTIC_PASSWORD in .env}
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}
      BACKUP_HEALTHCHECK_URL: ${BACKUP_HEALTHCHECK_URL:-}
      RESTORE_HEALTHCHECK_URL: ${RESTORE_HEALTHCHECK_URL:-}
    volumes:
      - media:/data/media:ro
      - ./backups:/backups
      - restic_cache:/root/.cache/restic
    logging: *logging

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
  restic_cache:
